{% extends "_split.html" %}
{% block title %}Log in{% endblock %}
{% block hero %}
<h1 class="hero-title">Welcome back.</h1>
<p class="hero-text">Your spending missed you. Your wallet, less so.</p>
{% endblock %}
{% block panel %}
<h2 class="panel-title">Log in</h2>
<p class="panel-sub">Good to see you again.</p>
{% if error %}<p class="form-notice is-error" role="alert">{{ error }}</p>{% endif %}
<form class="auth-form" method="post" action="/login">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required value="{{ email or '' }}" />
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" />
  <button type="submit" class="btn-primary">Log in</button>
</form>
<p class="panel-switch">New here? <a href="/signup">Sign up</a></p>
{% endblock %}
